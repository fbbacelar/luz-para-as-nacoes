<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Palavra para Hoje</title>

    <link rel="icon"
          href="favicon.ico">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <img src="img/logo.png"
         class="logo"
         alt="Logo">

    <h1>Palavra para Hoje</h1>

    <div class="card">

        <p id="loading">

            Carregando Palavra de Deus...

        </p>

        <h3 id="tema"></h3>

        <p id="texto"
           class="texto"></p>

        <p id="referencia"
           class="referencia"></p>

    </div>

    <div class="buttons">

        <button id="novo">

            📖 Novo Versículo

        </button>

        <button id="compartilhar">

            📤 Compartilhar

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
